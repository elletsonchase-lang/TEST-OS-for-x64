name: Build Custom Live OS

on: [push]

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Compilation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y live-build squashfs-tools xorriso isolinux debootstrap debian-archive-keyring

    - name: Configure and Run Build Engine
      run: |
        # Completely clear old, broken project layout states
        lb clean --all || true
        
        # Run a blank layout initialization to create the folder structures
        lb config --mode debian --architectures amd64 --distribution bookworm --binary-images iso-hybrid --memtest none

        # FORCE VITAL OVERRIDES: Write the exact mirror file layouts directly to skip the parsing bugs
        mkdir -p config
        echo "LB_PARENT_MIRROR_BOOTSTRAP=\"http://debian.org\"" >> config/bootstrap
        echo "LB_MIRROR_BOOTSTRAP=\"http://debian.org\"" >> config/bootstrap
        echo "LB_PARENT_MIRROR_CHROOT=\"http://debian.org\"" >> config/chroot
        echo "LB_MIRROR_CHROOT=\"http://debian.org\"" >> config/chroot
        echo "LB_PARENT_MIRROR_BINARY=\"http://debian.org\"" >> config/binary
        echo "LB_MIRROR_BINARY=\"http://debian.org\"" >> config/binary

        # Create explicit local layout pointer links to block truncation
        echo "http://debian.org" > config/mirror
        echo "http://debian.org" > config/mirror.bootstrap

        # Make sure the post-installation script hook permissions carry over
        if [ -f config/hooks/live/01-setup-system.chroot ]; then chmod +x config/hooks/live/01-setup-system.chroot; fi

        # Launch compilation using raw environmental variables
        export LB_MODE="debian"
        export LB_BOOTSTRAP_MIRROR="http://debian.org"
        export LB_MIRROR_CHROOT="http://debian.org"
        export LB_MIRROR_BINARY="http://debian.org"
        
        sudo -E lb build

    - name: Upload Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iMac-Custom-Live-OS
        path: "*.iso"
