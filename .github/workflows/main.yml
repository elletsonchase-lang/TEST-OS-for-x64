name: Build Custom Live OS

on: [push]

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Compilation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y live-build squashfs-tools xorriso isolinux debootstrap debian-archive-keyring

    - name: Generate Project Infrastructure
      run: |
        # Create necessary internal directories
        mkdir -p config/package-lists
        mkdir -p config/hooks/live

        # Wipe out configuration history to completely clear bad URL paths
        lb clean --all || true

        # Base configuration pointing precisely to the official debian mirror network
        lb config \
          --architectures amd64 \
          --distribution bookworm \
          --archive-areas "main contrib non-free non-free-firmware" \
          --mirror-bootstrap "http://debian.org" \
          --mirror-chroot "http://debian.org" \
          --mirror-binary "http://debian.org" \
          --binary-images iso-hybrid \
          --memtest none

        # Direct the tool to explicitly remember the debian mirror mapping paths
        echo "http://debian.org" > config/mirror
        echo "http://debian.org" > config/mirror.bootstrap

        # Write out your target software package lists
        cat << 'EOF' > config/package-lists/custom.list.chroot
        linux-image-amd64
        live-boot
        live-config
        live-config-xfce
        xfce4
        xfce4-goodies
        thunar
        xfce4-terminal
        gdebi
        firefox-esr
        broadcom-sta-dkms
        firmware-brcm80211
        bluez
        bluez-tools
        blueman
        network-manager-gnome
        EOF

        # Write out the background configuration system script hook
        cat << 'EOF' > config/hooks/live/01-setup-system.chroot
        #!/bin/sh
        set -e
        echo "[main]\nplugins=ifupdown,keyfile\n\n[ifupdown]\nmanaged=true" > /etc/NetworkManager/NetworkManager.conf
        echo "wl" >> /etc/modules
        systemctl enable bluetooth || true
        systemctl enable NetworkManager || true
        apt-get clean
        EOF

        # Grant execution permissions
        chmod +x config/hooks/live/01-setup-system.chroot

    - name: Run Build Engine
      run: |
        # Block the host environment from overriding mirror strings
        export LB_BOOTSTRAP_FROM_HOST="false"
        sudo -E lb build

    - name: Upload Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iMac-Custom-Live-OS
        path: "*.iso"
