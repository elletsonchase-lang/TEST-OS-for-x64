name: Build Custom Live OS

on: [push]

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Compilation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y live-build squashfs-tools xorriso isolinux debootstrap debian-archive-keyring

    - name: Configure and Run Build Engine
      run: |
        # Force wipe any previous build environments
        lb clean --all || true
        
        # A completely flat configuration line with zero backslashes to avoid parsing bugs
        lb config --architectures amd64 --distribution bookworm --archive-areas "main contrib non-free non-free-firmware" --mirror-bootstrap "http://debian.org" --mirror-chroot "http://debian.org" --mirror-binary "http://debian.org" --binary-images iso-hybrid --memtest none

        # Fix hook file runtime execution bits
        if [ -f config/hooks/live/01-setup-system.chroot ]; then chmod +x config/hooks/live/01-setup-system.chroot; fi

        # Trigger compilation using absolute mirrors
        sudo lb build

    - name: Upload Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iMac-Custom-Live-OS
        path: "*.iso"
