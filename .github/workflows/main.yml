name: Build Custom Live OS

on: [push]

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Compilation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y live-build squashfs-tools xorriso isolinux debootstrap debian-archive-keyring

    - name: Configure and Run Build Engine
      run: |
        # Wipe out any legacy broken configuration memory
        lb clean --all || true
        
        # KEY FIX: Added '--mode debian' to stop the tool from automatically defaulting to Ubuntu
        lb config \
          --mode debian \
          --architectures amd64 \
          --distribution bookworm \
          --archive-areas "main contrib non-free non-free-firmware" \
          --mirror-bootstrap "http://debian.org" \
          --mirror-chroot "http://debian.org" \
          --mirror-binary "http://debian.org" \
          --binary-images iso-hybrid \
          --memtest none

        # Ensure hook file runtime execution bits carry over cleanly
        if [ -f config/hooks/live/01-setup-system.chroot ]; then chmod +x config/hooks/live/01-setup-system.chroot; fi

        # Run the compiler directly using the isolated environment variables
        export LB_MODE="debian"
        sudo -E lb build

    - name: Upload Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iMac-Custom-Live-OS
        path: "*.iso"
