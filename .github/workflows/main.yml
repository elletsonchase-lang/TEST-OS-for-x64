name: Build Custom Live OS

on: [push]

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Compilation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y live-build squashfs-tools xorriso isolinux debootstrap debian-archive-keyring

    - name: Configure and Run Build Engine
      run: |
        # Wipe any bad layout memory
        lb clean --all || true
        
        # Base layout configuration without passing unstable mirror string structures
        lb config \
          --architectures amd64 \
          --distribution bookworm \
          --archive-areas "main contrib non-free non-free-firmware" \
          --binary-images iso-hybrid \
          --memtest none

        # Inject real mirror directory rules straight into the build system options
        mkdir -p config
        echo "http://debian.org" > config/mirror
        echo "http://debian.org" > config/mirror.bootstrap
        echo "http://debian.org" > config/mirror.chroot
        echo "http://debian.org" > config/mirror.binary

        # Fix hook file runtime execution bits
        if [ -f config/hooks/live/01-setup-system.chroot ]; then chmod +x config/hooks/live/01-setup-system.chroot; fi

        # Execute compilation while explicitly forcing system download environment parameters
        export LB_BOOTSTRAP_MIRROR="http://debian.org"
        export LB_MIRROR_CHROOT="http://debian.org"
        export LB_MIRROR_BINARY="http://debian.org"
        
        sudo -E lb build

    - name: Upload Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iMac-Custom-Live-OS
        path: "*.iso"
