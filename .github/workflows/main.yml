name: Build Custom Live OS (Fixed)

on: [push]

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Compilation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y live-build squashfs-tools xorriso isolinux debootstrap

    - name: Generate Project Infrastructure
      run: |
        # Create necessary directories first
        mkdir -p config/package-lists
        mkdir -p config/hooks/live

        # Clear any existing configuration to prevent duplicate crashes
        lb clean --all || true

        # Clean, flat configuration line to guarantee no multi-line backslash parsing issues
        lb config --architectures amd64 --distribution bookworm --archive-areas "main contrib non-free non-free-firmware" --binary-images iso-hybrid --memtest none

        # Write out your software package list directly
        cat << 'EOF' > config/package-lists/custom.list.chroot
        linux-image-amd64
        live-boot
        live-config
        live-config-xfce
        xfce4
        xfce4-goodies
        thunar
        xfce4-terminal
        gdebi
        firefox-esr
        broadcom-sta-dkms
        firmware-brcm80211
        bluez
        bluez-tools
        blueman
        network-manager-gnome
        EOF

        # Write out the system optimization script hook
        cat << 'EOF' > config/hooks/live/01-setup-system.chroot
        #!/bin/sh
        set -e
        echo "[main]\nplugins=ifupdown,keyfile\n\n[ifupdown]\nmanaged=true" > /etc/NetworkManager/NetworkManager.conf
        echo "wl" >> /etc/modules
        systemctl enable bluetooth || true
        systemctl enable NetworkManager || true
        apt-get clean
        EOF

        # Grant execution permissions
        chmod +x config/hooks/live/01-setup-system.chroot

    - name: Run Build Engine
      run: |
        # Force the builder to bypass strict host matching flags
        sudo lb build

    - name: Upload Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iMac-Custom-Live-OS
        path: "*.iso"
