name: Build Phoenix OS Live USB

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-live-iso:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            isolinux \
            syslinux-common

      - name: Build Phoenix OS Live USB
        run: |
          chmod +x scripts/build.sh
          sudo ./scripts/build.sh

      - name: Upload Phoenix OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-OS-Live-USB
          path: output/Phoenix-OS-Live-amd64.iso
          if-no-files-found: error
